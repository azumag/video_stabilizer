name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate, test, and build
        run: npm run check

      - name: Package unpacked extension
        run: |
          cd dist
          zip -r video-stabilizer-phase0.zip video-stabilizer LOAD_UNPACKED.txt

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-stabilizer-phase0
          path: dist/video-stabilizer-phase0.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: validate-test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download extension artifact
        uses: actions/download-artifact@v4
        with:
          name: video-stabilizer-phase0
          path: dist

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/video-stabilizer-phase0.zip
          generate_release_notes: true
