name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate, test, and build
        run: npm run check

      - name: Package unpacked extension
        run: |
          cd dist
          zip -r video-stabilizer-phase0.zip video-stabilizer LOAD_UNPACKED.txt

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-stabilizer-phase0
          path: dist/video-stabilizer-phase0.zip
          if-no-files-found: error
          retention-days: 14
